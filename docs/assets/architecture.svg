<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <style>
      .t  { font-size: 20px; font-weight: 650; fill: #1f2933; text-anchor: middle; }
      .s  { font-size: 13.5px; fill: #52606d; text-anchor: middle; }
      .k  { font-size: 13.5px; fill: #1f2933; text-anchor: middle; font-family: Menlo, monospace; }
      .z  { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; }
      .c  { font-size: 13px; fill: #343a40; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .ce { text-anchor: end; }
      .cm { text-anchor: middle; }
      .ln { stroke: #495057; stroke-width: 1.8; fill: none; }
      .dl { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1600" height="1060" fill="#ffffff"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#1f2933">Distributed Mean: architecture</text>
  <text x="40" y="72" font-size="15" fill="#52606d">Generation and aggregation meet only at the contract. Only the coordinator writes task and operand state; workers never touch Postgres.</text>

  <!-- zones -->
  <rect x="30" y="240" width="380" height="720" rx="16" fill="#fffaf2" stroke="#f3d9b1"/>
  <text x="50" y="270" class="z" fill="#c26d00">GENERATION &#183; TEST HARNESS</text>
  <rect x="440" y="240" width="410" height="720" rx="16" fill="#f4fbf6" stroke="#7fbf95" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="460" y="270" class="z" fill="#2b8a52">CONTRACT &#183; SHARED STATE</text>
  <rect x="880" y="240" width="700" height="720" rx="16" fill="#f4f7fd" stroke="#c9d8f2"/>
  <text x="900" y="270" class="z" fill="#2b5fb8">AGGREGATION</text>

  <!-- browser -->
  <rect x="60" y="110" width="310" height="90" rx="12" fill="#f1f3f5" stroke="#868e96" stroke-width="1.6"/>
  <text x="215" y="145" class="t">Browser dashboard</text>
  <text x="215" y="170" class="s">set W &#183; submit jobs &#183; live view</text>

  <!-- API -->
  <rect x="60" y="300" width="310" height="130" rx="12" fill="#fff1dc" stroke="#e8890c" stroke-width="1.8"/>
  <text x="215" y="334" class="t">API</text>
  <text x="215" y="358" class="s">Node &#183; Express &#183; TypeScript</text>
  <text x="215" y="381" class="s">POST /jobs &#183; PUT /workers</text>
  <text x="215" y="403" class="s">SSE dashboard &#183; results/J.csv</text>

  <!-- generator -->
  <rect x="60" y="720" width="310" height="130" rx="12" fill="#fff1dc" stroke="#e8890c" stroke-width="1.8"/>
  <text x="215" y="754" class="t">Generator</text>
  <text x="215" y="778" class="s">Piscina thread pool in the API</text>
  <text x="215" y="801" class="s">seeded per file: hash(seed, i)</text>
  <text x="215" y="823" class="s">operand format, count = 1</text>

  <!-- postgres -->
  <rect x="500" y="300" width="320" height="170" rx="12" fill="#e3f4ea" stroke="#2f9e5b" stroke-width="1.8"/>
  <text x="660" y="336" class="t">Postgres 16</text>
  <text x="660" y="360" class="s">source of truth</text>
  <text x="660" y="392" class="k">jobs &#183; tasks &#183; operands</text>
  <text x="660" y="416" class="k">config &#183; workers &#183; events</text>
  <text x="660" y="446" class="s">ready_pool index (READY only)</text>

  <!-- contract statement -->
  <text x="660" y="555" class="t" fill="#2b8a52">The contract</text>
  <text x="660" y="582" class="s">input files in the operand format</text>
  <text x="660" y="604" class="s">at files/J/f1 &#8230; fF</text>
  <text x="660" y="626" class="s">+ the GENERATING &#8594; NEW flip</text>

  <!-- object storage -->
  <rect x="500" y="700" width="320" height="170" rx="12" fill="#e3f4ea" stroke="#2f9e5b" stroke-width="1.8"/>
  <text x="660" y="736" class="t">Object storage</text>
  <text x="660" y="760" class="s">bytes only &#183; never listed</text>
  <text x="660" y="792" class="k">files/J/f{i}</text>
  <text x="660" y="816" class="k">partials/J/{task_id}</text>
  <text x="660" y="840" class="k">results/J.csv</text>

  <!-- coordinator -->
  <rect x="960" y="300" width="340" height="130" rx="12" fill="#e7f0fd" stroke="#2b6cd6" stroke-width="1.8"/>
  <text x="1130" y="334" class="t">Coordinator</text>
  <text x="1130" y="358" class="s">Python &#183; asyncio &#183; active-standby</text>
  <text x="1130" y="381" class="s">groups operands, applies the tail rule</text>
  <text x="1130" y="403" class="s">only writer of task state</text>

  <!-- rabbitmq -->
  <rect x="960" y="510" width="340" height="150" rx="12" fill="#fde8ef" stroke="#d6336c" stroke-width="1.8"/>
  <text x="1130" y="543" class="t">RabbitMQ 4</text>
  <text x="1130" y="566" class="s">quorum queues &#183; transport only</text>
  <rect x="980" y="582" width="110" height="30" rx="15" fill="#ffffff" stroke="#d6336c"/>
  <text x="1035" y="602" class="k">tasks</text>
  <rect x="1170" y="582" width="120" height="30" rx="15" fill="#ffffff" stroke="#d6336c"/>
  <text x="1230" y="602" class="k">completions</text>
  <rect x="1075" y="622" width="110" height="26" rx="13" fill="#ffffff" stroke="#d6336c" stroke-dasharray="4 3"/>
  <text x="1130" y="640" class="k" font-size="12">tasks.dlq</text>
  <text x="1195" y="640" class="s" font-size="12" text-anchor="start">poison</text>

  <!-- workers (stacked) -->
  <rect x="976" y="756" width="340" height="130" rx="12" fill="#d3eef6" stroke="#1098ad" stroke-width="1.2"/>
  <rect x="968" y="748" width="340" height="130" rx="12" fill="#dcf2f8" stroke="#1098ad" stroke-width="1.2"/>
  <rect x="960" y="740" width="340" height="130" rx="12" fill="#e5f6fb" stroke="#1098ad" stroke-width="1.8"/>
  <text x="1130" y="774" class="t">Workers &#215; W</text>
  <text x="1130" y="798" class="s">Python processes &#183; one consumer each</text>
  <text x="1130" y="821" class="s">fetch &#8804; 5 operands &#183; add &#183; write</text>
  <text x="1130" y="843" class="s">pure compute, no decisions</text>

  <!-- supervisor -->
  <rect x="1380" y="740" width="180" height="130" rx="12" fill="#efe9fb" stroke="#7048e8" stroke-width="1.8"/>
  <text x="1470" y="774" class="t">Supervisor</text>
  <text x="1470" y="798" class="s">Python</text>
  <text x="1470" y="821" class="s">reconciles running</text>
  <text x="1470" y="843" class="s">workers to desired W</text>

  <!-- browser <-> API -->
  <line x1="215" y1="202" x2="215" y2="298" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="227" y="222" class="c">POST /jobs &#183; PUT /workers</text>
  <text x="227" y="240" class="c">SSE snapshots</text>

  <!-- API <-> Postgres -->
  <line x1="372" y1="365" x2="498" y2="365" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="435" y="338" class="c cm">create job,</text>
  <text x="435" y="355" class="c cm">desired W + NOTIFY</text>
  <text x="435" y="385" class="c cm">read status</text>

  <!-- API -> generator -->
  <line x1="215" y1="432" x2="215" y2="718" class="ln" marker-end="url(#a)"/>
  <text x="227" y="520" class="c">generateRange(job, start,</text>
  <text x="227" y="538" class="c">end, seed) on threads</text>

  <!-- generator -> postgres -->
  <polyline points="372,745 420,745 420,440 498,440" class="ln" marker-end="url(#a)"/>
  <text x="408" y="640" class="c ce">GENERATING &#8594; NEW</text>
  <text x="408" y="658" class="c ce">when every range is done</text>

  <!-- generator -> storage -->
  <line x1="372" y1="800" x2="498" y2="800" class="ln" marker-end="url(#a)"/>
  <text x="435" y="790" class="c cm">PUT files</text>

  <!-- postgres <-> coordinator -->
  <line x1="822" y1="365" x2="958" y2="365" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="890" y="338" class="c cm">completion txn:</text>
  <text x="890" y="355" class="c cm">lock &#183; dedupe &#183; group</text>
  <text x="890" y="385" class="c cm">claim NEW job</text>
  <text x="890" y="402" class="c cm">recovery scan</text>

  <!-- coordinator -> tasks -->
  <line x1="1035" y1="432" x2="1035" y2="508" class="ln" marker-end="url(#a)"/>
  <text x="1023" y="462" class="c ce">publish task</text>
  <text x="1023" y="480" class="c ce">after commit</text>

  <!-- completions -> coordinator -->
  <line x1="1230" y1="508" x2="1230" y2="432" class="ln" marker-end="url(#a)"/>
  <text x="1242" y="462" class="c">consume completion</text>
  <text x="1242" y="480" class="c">ack after commit</text>

  <!-- tasks -> workers -->
  <line x1="1035" y1="662" x2="1035" y2="738" class="ln" marker-end="url(#a)"/>
  <text x="1023" y="690" class="c ce">deliver task</text>
  <text x="1023" y="708" class="c ce">prefetch 1</text>

  <!-- workers -> completions -->
  <line x1="1230" y1="738" x2="1230" y2="662" class="ln" marker-end="url(#a)"/>
  <text x="1242" y="690" class="c">completion</text>
  <text x="1242" y="708" class="c">{count, output_key}</text>

  <!-- workers <-> storage -->
  <line x1="822" y1="805" x2="958" y2="805" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="890" y="795" class="c cm">GET operands</text>
  <text x="890" y="825" class="c cm">PUT partial / result</text>

  <!-- supervisor -> workers -->
  <line x1="1378" y1="805" x2="1318" y2="805" class="ln" marker-end="url(#a)"/>
  <text x="1340" y="900" class="c cm">spawn /</text>
  <text x="1340" y="918" class="c cm">SIGTERM drain</text>
  <line x1="1340" y1="808" x2="1340" y2="885" stroke="#adb5bd" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- supervisor <-> postgres -->
  <polyline points="1470,738 1470,222 740,222 740,298" class="ln dl" marker-end="url(#a)"/>
  <text x="1105" y="212" class="c cm">LISTEN desired_workers &#183; reads desired W, writes the workers table</text>

  <!-- legend -->
  <g font-size="13" fill="#343a40">
    <rect x="40" y="990" width="18" height="18" rx="4" fill="#fff1dc" stroke="#e8890c"/><text x="66" y="1004">generation</text>
    <rect x="170" y="990" width="18" height="18" rx="4" fill="#e3f4ea" stroke="#2f9e5b"/><text x="196" y="1004">shared state</text>
    <rect x="310" y="990" width="18" height="18" rx="4" fill="#e7f0fd" stroke="#2b6cd6"/><text x="336" y="1004">coordination</text>
    <rect x="450" y="990" width="18" height="18" rx="4" fill="#fde8ef" stroke="#d6336c"/><text x="476" y="1004">transport</text>
    <rect x="565" y="990" width="18" height="18" rx="4" fill="#e5f6fb" stroke="#1098ad"/><text x="591" y="1004">compute</text>
    <rect x="675" y="990" width="18" height="18" rx="4" fill="#efe9fb" stroke="#7048e8"/><text x="701" y="1004">supervision</text>
    <rect x="805" y="990" width="18" height="18" rx="4" fill="#f1f3f5" stroke="#868e96"/><text x="831" y="1004">client</text>
    <line x1="920" y1="999" x2="970" y2="999" class="ln" marker-end="url(#a)"/><text x="980" y="1004">what flows, captioned</text>
    <line x1="1150" y1="999" x2="1200" y2="999" class="ln dl" marker-end="url(#a)"/><text x="1210" y="1004">control loop (desired state)</text>
  </g>
</svg>
